name = "ovet"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "production"
CACHE_TTL_SECONDS = "60"
HANDLE_RESOLUTION_TTL_SECONDS = "86400"
RATE_LIMIT_PER_MINUTE = "30"
SCRAPE_FALLBACK_ENABLED = "true"
